name: AppleRef
options:
  bundleIdPrefix: com.devuap
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  AppleRef:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devuap.appleref
        TARGETED_DEVICE_FAMILY: "1"
  AppleRefUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AppleRef
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devuap.appleref.uitests
        TEST_TARGET_NAME: AppleRef
schemes:
  AppleRef:
    build:
      targets:
        AppleRef: all
    test:
      targets: [AppleRefUITests]
